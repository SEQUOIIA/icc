[package]
name = "icc"
version = "0.1.0"
authors = ["Emil H. Clausen (SEQUOIIA) <sequoiia@hummel.yt>"]
edition = "2021"

[[bin]]
name = "icc"
path = "src/bin/icc.rs"

[dependencies]
#seqtf_bootstrap = {registry = "seqtf", version = "0.1.4"}
log = "0.4.28"
pretty_env_logger = "0.5"
pnet = "0.35.0"
pnet_macros_support = "0.35.0"
rand = "0.9.2"
chrono = "0.4.42"
toml = "0.9"
serde_derive = "1.0"
serde = "^1"
ctrlc = {version = "3.5.1", features = ["termination"]}
[dependencies.rusqlite]
version = "0.37.0"
features = ["bundled"]
